name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The public-scope gate examines every reachable path, not only HEAD.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: experiments/requirements-lock.txt
      - name: Enforce public repository scope
        run: make scope-check PYTHON=python
      - name: Check local documentation links
        run: make links PYTHON=python
      - name: Install pinned experiment environment
        run: python -m pip install -r experiments/requirements-lock.txt
      - name: Run unit tests
        run: make test PYTHON=python
      - name: Verify committed artifact hashes
        run: make verify-artifacts PYTHON=python
