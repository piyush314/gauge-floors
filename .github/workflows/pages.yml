name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tutorials/**"
      - "notebooks/**"
      - "experiments/**"
      - "figures/**"
      - "scripts/check_public_scope.py"
      - "scripts/execute_notebooks.py"
      - "Makefile"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tutorials/**"
      - "notebooks/**"
      - "experiments/**"
      - "figures/**"
      - "scripts/check_public_scope.py"
      - "scripts/execute_notebooks.py"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: |
            experiments/requirements-lock.txt
            notebooks/requirements.txt
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Enforce public repository scope
        run: make scope-check PYTHON=python
      - name: Check local documentation links
        run: make links PYTHON=python
      - name: Install pinned documentation environment
        run: >-
          python -m pip install
          -r experiments/requirements-lock.txt
          -r notebooks/requirements.txt
      - name: Run unit tests and verify artifact hashes
        run: make test verify-artifacts PYTHON=python
      - name: Execute notebooks from clean kernels
        run: >-
          python scripts/execute_notebooks.py
          --python python
          --output-dir "$RUNNER_TEMP/executed-notebooks"
      - name: Render site
        run: quarto render docs
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        with:
          path: docs/_site

  deploy:
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
